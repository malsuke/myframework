services:
  proxy:
    image: nginx:latest
    ports:
      - 443:443
    volumes:
      - ./nginx:/etc/nginx
    depends_on:
      - app
  app:
    build: ./web/src
    volumes:
      # - ./web/config/php.ini:/usr/local/etc/php/php.ini
      - ./web/src:/var/www
    ports:
      - 80:80
